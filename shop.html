<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZELVORA | Shop</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topbar"><span>🚚 Free Shipping on Orders Above ₹999</span><span>🛡️ Cash on Delivery Available</span><span>☎ Customer Support</span></div><header><div class="header-main"><a class="logo" href="index.html"><span class="logo-mark">Z</span><span><b>ZELVORA</b><small>Smart Finds. Better Prices.</small></span></a><div class="search"><input id="q" placeholder="Search products..."><button onclick="filter()">⌕</button></div><div class="header-actions"><a href="account.html">♙<small>Account</small></a><a href="cart.html">🛒<small>Cart</small></a></div></div><nav><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="index.html#deals">Today's Deals</a><a href="track-order.html">Track Order</a></nav></header>
<main class="products-section" style="margin-top:30px"><div class="section-head"><h2>All Products</h2><select><option>Sort: Popular</option><option>Price: Low to High</option><option>Price: High to Low</option></select></div><div class="products" id="grid"></div></main>
<script>const p=[['Noise ColorFit Pro 4 Smart Watch','₹2,199','⌚'],['Boult Audio AirBass Z40 Earbuds','₹1,199','🎧'],['E Gear Classic Laptop Backpack','₹1,299','🎒'],["Sparx Men's Sports Shoes",'₹1,049','👟'],['Denver Hamilton Perfume 100ml','₹599','🧴'],['Wireless Neckband','₹799','🎧'],['Travel Trolley Bag','₹2,499','🧳'],['LED Desk Lamp','₹699','💡']];function draw(a=p){grid.innerHTML=a.map((x,i)=>`<article class="card"><div class="pic">${x[2]}</div><h3>${x[0]}</h3><div class="stars">★★★★★</div><div class="price">${x[1]}</div><a class="add" href="product.html">VIEW PRODUCT</a></article>`).join('')}function filter(){let q=document.getElementById('q').value.toLowerCase();draw(p.filter(x=>x[0].toLowerCase().includes(q)))}draw();</script></body></html>
