<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELVORA Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container" style="max-width:1100px;margin:30px auto;padding:20px">
<h1>ZELVORA Admin</h1>
<p>Enter your server-side admin token to view orders. Keep this token private.</p>
<input id="token" type="password" placeholder="ADMIN_TOKEN" style="padding:12px;width:100%;max-width:500px">
<button id="load" class="btn btn-primary" style="margin-top:10px">Load Dashboard</button>
<div id="out" style="margin-top:25px"></div>
</main>
<script>
document.getElementById('load').onclick=async()=>{
 const token=document.getElementById('token').value;
 const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});
 const o=document.getElementById('out');
 if(!r.ok){o.textContent='Unauthorized or server not configured.';return}
 const data=await r.json();
 o.innerHTML='<h2>Orders ('+data.length+')</h2>'+data.map(x=>'<div style="padding:14px;border:1px solid #ddd;margin:8px 0"><b>'+x.order_no+'</b> — ₹'+(x.total/100).toFixed(2)+'<br>'+x.customer_name+' · '+x.phone+'<br>Status: '+x.order_status+' · Payment: '+x.payment_status+'</div>').join('');
};
</script></body></html>
